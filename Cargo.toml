[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz crate is its own workspace root (see fuzz/Cargo.toml); keep it out
# of the main workspace so `cargo test`/`clippy --workspace` don't pull in the
# nightly-only libFuzzer targets.
exclude = ["fuzz"]

# Build requirement: `wsl-webauthn-pam` maps a panic to `PAM_ABORT` via
# `catch_unwind`, and `wsl-webauthn-bridge` must report failures gracefully.
# Both require unwinding panics; do NOT set `panic = "abort"` in any profile.
# Each of those crate roots carries a `#[cfg(not(panic = "unwind"))]
# compile_error!` guard so an aborting profile fails the build instead.

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 is the true floor: `wsl-webauthn-cli` uses let-chains (`if let … && …`),
# stabilized in 1.88. Verified by the `msrv` CI job, which checks the workspace
# with `cargo +1.88.0 … --locked`.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kirin-xiao/wsl-webauthn-pam"

[workspace.dependencies]
# Core serialization / encoding
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"
thiserror = "2.0.21"
anyhow = "1.0.104" # CLI only
libc = "0.2.189"
toml = "0.9.8"

# Randomness: OsRng for challenges. `getrandom` is the OS entropy
# backend for the 0.8 series.
rand = { version = "0.8.5", features = ["getrandom", "std", "std_rng"] }

# CBOR / hashing / crypto (verifier)
#
# PINNED to the `der 0.7` / `signature 2` RustCrypto generation. The newest
# releases (p256 0.14, ecdsa 0.17, sha2 0.11, x509-cert 0.3, der 0.8) moved to
# `signature 3`, but no stable `rsa` in that generation exists (rsa 0.10 is
# release-candidate only) and `rsa 0.9` still uses `der 0.7` / `signature 2`.
# Mixing them would pull two incompatible `signature`/`der` trees into the
# verifier. Keep these; do not bump individually.
ciborium = "0.2.2"
sha2 = "0.10.9"
p256 = { version = "0.13.2", features = ["ecdsa"] }
ecdsa = "0.16.9"
rsa = "0.9.10"
ed25519-dalek = "2.1.1"
x509-cert = "0.2.5"
der = "0.7.10"
const-oid = "0.9.6"

# Test-only
proptest = "1.11.0"

# `strip` removes debug/symbol tables and `thin` LTO
# optimizes across the crate boundary without the full `fat`-LTO build-time
# blowup. `panic` deliberately stays at its default (`unwind`): the PAM mapping
# to `PAM_ABORT` and the bridge's graceful failure both require unwinding, and
# each crate root carries a `#[cfg(not(panic = "unwind"))] compile_error!`.
[profile.release]
strip = true
lto = "thin"
