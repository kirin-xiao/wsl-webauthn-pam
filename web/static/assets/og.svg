<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="wsl-webauthn-pam — passwordless sudo and su inside WSL2">
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="80" y="92" fill="#FFB000" font-size="26" font-weight="600">&gt;_</text>
    <text x="126" y="92" fill="#9A9A9A" font-size="24">wsl-webauthn-pam</text>
    <text x="1120" y="92" fill="#9A9A9A" font-size="22" text-anchor="end">MIT · Linux-side verification</text>
  </g>

  <g font-family="IBM Plex Sans, system-ui, sans-serif">
    <text x="80" y="228" fill="#EDEDED" font-size="74" font-weight="600" letter-spacing="-2">Passwordless sudo</text>
    <text x="80" y="310" fill="#EDEDED" font-size="74" font-weight="600" letter-spacing="-2">inside WSL2.</text>
    <text x="80" y="368" fill="#B8B8B8" font-size="30">Authenticated with the Windows Hello passkey you already use.</text>
  </g>

  <rect x="80" y="430" width="1040" height="104" fill="#131313" stroke="#666666"/>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="24">
    <text x="108" y="472" fill="#FFB000">$</text>
    <text x="134" y="472" fill="#EDEDED">wsl-webauthn-pam verify</text>
    <text x="108" y="508" fill="#B8B8B8">verify: PASS</text>
    <text x="360" y="508" fill="#9A9A9A">assertion: verified (ES256)</text>
  </g>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20" fill="#9A9A9A">
    <text x="80" y="588">pure PAM module · password fallback · signed apt repo</text>
    <text x="1120" y="588" text-anchor="end">kirin-xiao.github.io/wsl-webauthn-pam</text>
  </g>
</svg>
