[package]
name = "wsl-webauthn-verifier-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# This directory is deliberately its own workspace root: `cargo-fuzz` requires it,
# and the parent workspace (`members = ["crates/*"]`) explicitly `exclude`s `fuzz`
# so a root `cargo test`/`cargo clippy` never tries to build the libFuzzer targets.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
wsl-webauthn-verifier = { path = "../crates/wsl-webauthn-verifier" }
wsl-webauthn-protocol = { path = "../crates/wsl-webauthn-protocol" }
p256 = { version = "0.13.2", features = ["ecdsa"] }
ciborium = "0.2.2"
sha2 = "0.10.9"

[[bin]]
name = "attestation_object"
path = "fuzz_targets/attestation_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attestation"
path = "fuzz_targets/attestation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authenticator_data"
path = "fuzz_targets/authenticator_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cose_key"
path = "fuzz_targets/cose_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "assertion"
path = "fuzz_targets/assertion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tpm"
path = "fuzz_targets/tpm.rs"
test = false
doc = false
bench = false
