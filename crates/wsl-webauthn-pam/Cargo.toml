[package]
name = "wsl-webauthn-pam"
description = "PAM module pam_wsl_webauthn.so (Linux cdylib)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pam_wsl_webauthn"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pam-test-fake-bridge"
path = "src/bin/test_fake_bridge.rs"
test = false
bench = false

[dependencies]
wsl-webauthn-protocol = { path = "../wsl-webauthn-protocol" }
wsl-webauthn-store = { path = "../wsl-webauthn-store" }
wsl-webauthn-runner = { path = "../wsl-webauthn-runner" }
wsl-webauthn-verifier = { path = "../wsl-webauthn-verifier" }
serde_json = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Test support only: tempdir-backed stores, a real ES256 keypair to sign the
# scripted assertions, and CBOR to build the enrolled COSE key.
tempfile = "3"
p256 = { workspace = true, features = ["ecdsa"] }
ciborium = { workspace = true }
# Test hashing: compute expected bridge pins in the harnesses.
sha2 = { workspace = true }
# Enable the runner's test-only seams (`without_interop_check`, `.args`,
# `.taskkill_program`) used by `tests/support/mod.rs`; production builds take the
# runner without this feature, so those seams are compile-time unavailable there.
#
# Why a dev-dependency keeps the feature off the shipped cdylib: a normal
# `cargo build -p wsl-webauthn-pam --release` does not build dev-dependencies, so
# this edge is simply absent from that graph and the runner is compiled without
# `--cfg feature="test-support"` (verify with `cargo build -p wsl-webauthn-pam
# --release -v`). Resolver 3 unifies features across all edges *within one
# invocation*, so if this edge were moved into `[dependencies]` the feature would
# be enabled for the cdylib too.
wsl-webauthn-runner = { path = "../wsl-webauthn-runner", features = ["test-support"] }
