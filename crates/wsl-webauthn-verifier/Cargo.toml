[package]
name = "wsl-webauthn-verifier"
description = "Security core: pure-Rust WebAuthn assertion/attestation verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
wsl-webauthn-protocol = { path = "../wsl-webauthn-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
ciborium = { workspace = true }
# `oid` exposes `AssociatedOid for Sha256`, required by `rsa`'s prefixed
# PKCS#1 v1.5 verifying key.
sha2 = { workspace = true, features = ["oid"] }
# SHA-1 is only used by the `tpm` attestation path: the Windows Hello AIK signs
# `certInfo` with RS1 (COSE alg -65535), whose prefix `rsa` needs `Sha1: AssociatedOid`.
sha1 = { version = "0.10.6", features = ["oid"] }
p256 = { workspace = true, features = ["pkcs8"] }
ecdsa = { workspace = true }
rsa = { workspace = true, features = ["sha2"] }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
x509-cert = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }

[features]
# Compiles the `verify_attestation_with_anchor` trust-anchor injection seam. It is
# intentionally off by default: a downstream crate that never enables it cannot
# substitute an attacker-chosen anchor, so production verification always uses the
# pinned `MS_TPM_ROOT_2014_SHA256`. The integration/fuzz suites need it to inject a
# synthetic root (no test can forge a certificate hashing to the real Microsoft
# root), so this crate enables it for its own test targets via the self dev-dependency
# below.
test-anchor = []

[dev-dependencies]
# Enable `test-anchor` for this crate's own integration/property tests. This is the
# documented "self dev-dependency" pattern: production `cargo build` does not build
# dev-dependencies, so the seam stays unavailable to downstream crates.
wsl-webauthn-verifier = { path = ".", features = ["test-anchor"] }
proptest = { workspace = true }
# Randomness for the synthesized test suite (key generation, nonces).
rand = { workspace = true }
# Certificate builder used only by the test harness.
x509-cert = { workspace = true, features = ["builder"] }
rsa = { workspace = true, features = ["sha2"] }
ed25519-dalek = { workspace = true, features = ["pkcs8", "rand_core"] }
# SHA-1 for the synthesized `tpm`/RS1 attestation vectors.
sha1 = { version = "0.10.6", features = ["oid"] }
