name: Release

# Release workflow.
#
# Trigger: pushing a tag matching `v*` (e.g. v0.2.0). The whole workflow builds
# from the *tag* ref (actions/checkout defaults to the triggering ref), so the
# artifacts are exactly the tagged commit.
#
# `publish` is gated on a `gate` job that re-runs fmt/clippy/test on the tagged
# commit, so a tag cannot publish bytes whose test/lint jobs never ran.
# (Tag pushes do not trigger ci.yaml, hence the in-workflow re-run.)
#
# Every `uses:` is pinned to a full 40-char commit SHA (see ci.yaml header).
# Release binaries are built with `[profile.release] strip=true, lto="thin"`
# (root Cargo.toml), preserving `panic = "unwind"`.
#
# glibc floor: the Linux module and CLI are compiled inside Ubuntu 20.04
# (glibc 2.31) by .github/scripts/build-glibc-floor.sh, and the ELF is asserted
# against that floor by .github/scripts/check-glibc-floor.sh. Building on the
# newest runner would silently raise the floor to that runner's glibc and make
# the result unloadable on Debian 12 / Ubuntu 22.04 — the distros the .deb
# targets. The `.so` and CLI are otherwise distro-agnostic (they link only
# libpam.so.0, libc.so.6, and libgcc_s.so.1), so one glibc build per arch feeds
# the tarball and the .deb.
#
# Runner choice for aarch64: we use the native GitHub-hosted ARM runners
# (`ubuntu-24.04-arm`, `windows-11-arm`) rather than cross-compiling. This
# avoids shipping a cross-linked libpam0g-dev/CRT. If those labels are ever
# unavailable on a plan, replace the
# matrix `runner` values with an x86_64 runner + `cross`/`cargo-zigbuild`.
#
# Release layout (per architecture):
#   wsl-webauthn-pam-<version>-<arch>.tar.gz
#     ├── pam_wsl_webauthn.so        (Linux PAM module, renamed from lib…)
#     ├── wsl-webauthn-pam           (CLI)
#     ├── WSLWebAuthnBridge.exe      (Windows bridge for the same arch)
#     ├── bootstrap.sh
#     ├── pam-config
#     └── README.md
#   wsl-webauthn-pam_<version>_<deb-arch>.deb   (Debian/Ubuntu package, per arch)
#   SHA256SUMS                       (checksums for all tarballs and .debs)
#   bootstrap.sh                     (also published top-level, so the
#                                     `releases/latest/download/bootstrap.sh`
#                                     URL works without a tarball)
#
# Both the Linux module and the matching Windows bridge ship in the same
# tarball because the CLI's `install` copies the bridge onto the Windows side.
# The apt repository is built by a later job (`apt-repo`) from the published
# .debs and deployed to GitHub Pages; it is rebuilt from the release assets on
# each run, so the index cannot drift from the packages it advertises (the signed
# `Release` still carries a fresh `Date:`, so its bytes are not reproducible).
# That job needs the repository secrets APT_GPG_PRIVATE_KEY (and, for a protected
# key, APT_GPG_PASSPHRASE) plus Pages set to deploy from GitHub Actions — see
# CONTRIBUTING.md.

on:
  push:
    tags: ["v*"]

# The release job needs write access to create the GitHub Release; build jobs
# explicitly drop back to read-only below.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "2"

jobs:
  build-linux:
    name: linux ${{ matrix.arch }} (.so + CLI, glibc 2.31)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compiled in a glibc-2.31 container (Ubuntu 20.04): the container, not the
      # runner, sets the glibc floor. Docker is preinstalled on both runners.
      - name: build module + CLI (glibc 2.31 container)
        run: sh .github/scripts/build-glibc-floor.sh

      - name: assert the glibc floor
        run: >
          sh .github/scripts/check-glibc-floor.sh 2.31
          target/release/libpam_wsl_webauthn.so
          target/release/wsl-webauthn-pam

      - name: checksums
        run: |
          sha256sum target/release/libpam_wsl_webauthn.so
          sha256sum target/release/wsl-webauthn-pam

      - name: upload linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/libpam_wsl_webauthn.so
            target/release/wsl-webauthn-pam
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: windows ${{ matrix.arch }} (msvc exe)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build bridge (locked)
        run: cargo build --release --locked -p wsl-webauthn-bridge

      - name: checksum
        shell: bash
        run: sha256sum target/release/WSLWebAuthnBridge.exe

      - name: upload windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: target/release/WSLWebAuthnBridge.exe
          if-no-files-found: error
          retention-days: 7

  gate:
    name: gate (fmt, clippy, test)
    # A tag push does not run
    # ci.yaml (it triggers on pushes to main and on PRs), so without this a tag
    # could publish
    # a commit whose fmt/clippy/test never ran or failed. Re-run the gate here on
    # the *tagged* commit (checkout defaults to the tag ref = GITHUB_SHA) and
    # make `publish` depend on it. Cost: one ubuntu-latest job per tag.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # bootstrap.sh ships in the release; shellcheck and the hermetic bootstrap
      # tests gate the tagged commit.
      - name: shellcheck
        run: |
          set -eu
          shellcheck -s sh bootstrap.sh
          shellcheck -s sh scripts/test-bootstrap.sh

      - name: hermetic bootstrap tests
        run: sh scripts/test-bootstrap.sh

  package-deb:
    name: package .deb (amd64 + arm64)
    # One nfpm spec assembles both .debs from the already-built Linux and Windows
    # artifacts, so packaging adds no compilation. Building on the x86_64 runner
    # is fine: nfpm only repackages the files handed to it.
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download the build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: install nfpm (pinned, checksum-verified)
        run: |
          set -eu
          sh .github/scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: build the .debs
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # A deb version may not contain '-', so map a pre-release (0.2.0-rc1)
          # to 0.2.0~rc1, which sorts below the final 0.2.0.
          deb_version=$(printf '%s' "$version" | tr '-' '~')
          for arch in x86_64 aarch64; do
            sh .github/scripts/build-deb.sh "$arch" "$deb_version" \
              "dist/linux-$arch" "dist/windows-$arch/WSLWebAuthnBridge.exe" deb
          done

      - name: verify the packages
        run: |
          set -eu
          for deb in deb/*.deb; do
            echo "--- $deb ---"
            dpkg-deb -I "$deb"
          done
          # Layout, modes, dependencies, and maintainer scripts. This asserts the
          # artifact-dir module is a regular file: the installer refuses a
          # symlinked source, so a symlink here would break every packaged
          # `install`.
          sh .github/scripts/check-deb-layout.sh "$(ls deb/*_amd64.deb)" x86_64-linux-gnu
          sh .github/scripts/check-deb-layout.sh "$(ls deb/*_arm64.deb)" aarch64-linux-gnu
          echo "package layout verified"

      - name: upload the .debs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: deb/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [gate, build-linux, build-windows, package-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: assemble per-arch tarballs + SHA256SUMS
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/out
          for arch in x86_64 aarch64; do
            dir="wsl-webauthn-pam-${VERSION}-${arch}"
            mkdir -p "dist/out/${dir}"
            cp dist/linux-${arch}/libpam_wsl_webauthn.so "dist/out/${dir}/pam_wsl_webauthn.so"
            cp dist/linux-${arch}/wsl-webauthn-pam          "dist/out/${dir}/"
            cp dist/windows-${arch}/WSLWebAuthnBridge.exe   "dist/out/${dir}/"
            cp bootstrap.sh pam-config README.md            "dist/out/${dir}/"
            # `actions/upload-artifact`/`download-artifact` do not preserve Unix
            # permissions, so the CLI arrives mode 0644. `bootstrap.sh` executes
            # the tarball's CLI directly (`"$DIR/wsl-webauthn-pam" install`), so
            # restore the exec bit here; the post-release smoke asserts it.
            chmod 0755 "dist/out/${dir}/wsl-webauthn-pam" "dist/out/${dir}/bootstrap.sh"
            tar -czf "dist/${dir}.tar.gz" -C dist/out "${dir}"
            # The tarball root must be exactly the one named directory, so
            # `tar xzf … && cd …` (README) works and the layout cannot silently
            # regress to "contents at the root".
            top="$(tar -tzf "dist/${dir}.tar.gz" | sed -n '1p')"
            if [ "${top}" != "${dir}/" ]; then
              echo "::error::${dir}.tar.gz root entry is '${top}', expected '${dir}/'"
              exit 1
            fi
          done
          # The .debs are already release-named; keep them next to the tarballs so
          # SHA256SUMS covers everything a user can download.
          cp dist/deb/*.deb dist/
          cd dist
          sha256sum wsl-webauthn-pam-*.tar.gz wsl-webauthn-pam_*.deb > SHA256SUMS
          echo '--- SHA256SUMS ---'
          cat SHA256SUMS

      - name: guard tag vs Cargo.toml version
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          # strip pre-release suffix for the comparison (e.g. 0.2.0-rc1 -> 0.2.0)
          base="${tag_version%%-*}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${base}" != "${manifest}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${manifest}"
            exit 1
          fi

      # Attach a signed SLSA build-provenance attestation to
      # the published tarballs, .debs, and SHA256SUMS, so a downloader can verify
      # which workflow + commit produced them
      # (`gh attestation verify <file> -R …`). For the .deb this is a second,
      # independent check alongside the apt repository's GPG-signed metadata: the
      # GPG signature authenticates the index, the attestation authenticates the
      # bytes.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Matches the release layout above: `wsl-webauthn-pam-<version>-<arch>.tar.gz`.
          # A pre-release version may itself contain a dash, so the leading `*` spans
          # `<version>` and the trailing `*` spans `<arch>`; the glob therefore still
          # requires both components (fail-closed, not a loose prefix match).
          # `bootstrap.sh` is attested too: it runs as root, so a downloader who
          # inspects before running can also check its provenance.
          subject-path: |
            dist/wsl-webauthn-pam-*-*.tar.gz
            dist/wsl-webauthn-pam_*_*.deb
            dist/SHA256SUMS
            bootstrap.sh

      - name: publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/wsl-webauthn-pam-*-*.tar.gz
            dist/wsl-webauthn-pam_*_*.deb
            dist/SHA256SUMS
            bootstrap.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags carrying a pre-release suffix (vX.Y.Z-rc1) publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publish a signed apt repository to GitHub Pages so Debian/Ubuntu users can
  # `apt install wsl-webauthn-pam`. The job runs after `publish` in this workflow
  # because a release created by GITHUB_TOKEN does not trigger `on: release`.
  # The repository is rebuilt from every released stable .deb on every run, so it
  # cannot drift from the release assets.
  apt-repo:
    name: publish signed apt repo (GitHub Pages)
    needs: [publish]
    # The `stable` suite must only ever serve stable releases; pre-release tags
    # are published as GitHub pre-releases and never enter the apt repo.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Actions-based Pages deployment requires these two.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apt tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      # Every historical stable .deb, so older versions stay installable/pinnable.
      # Pre-releases are excluded: the `stable` suite must never serve an `~rc`
      # package (the tag-push `if:` on this job already skips pre-releases; the
      # filter also keeps any historical pre-release out of the pool). A tag
      # predating .deb packaging simply has no matching asset and is skipped.
      - name: collect every released .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pool="site/apt/pool/main/w/wsl-webauthn-pam"
          mkdir -p "$pool"
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 \
              --exclude-pre-releases --json tagName -q '.[].tagName'); do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" \
              -p 'wsl-webauthn-pam_*.deb' -D "$pool" --clobber || true
          done
          ls -l "$pool"
          # The release that triggered this run must have landed in the pool, or
          # the published repo would silently be missing the new version.
          want="wsl-webauthn-pam_$(printf '%s' "${GITHUB_REF_NAME#v}" | tr '-' '~')_"
          found=0
          for candidate in "$pool/$want"*.deb; do
            if [ -e "$candidate" ]; then
              found=1
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::current release .deb (${want}*) is not in the pool"
            exit 1
          fi

      - name: import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$APT_GPG_PRIVATE_KEY" ] || {
            echo "::error::APT_GPG_PRIVATE_KEY is not set (see CONTRIBUTING.md)"
            exit 1
          }
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          [ -n "$fingerprint" ] || { echo "::error::no signing key imported"; exit 1; }
          # build-apt-repo.sh reads GPG_KEY_ID.
          echo "GPG_KEY_ID=$fingerprint" >> "$GITHUB_ENV"

      - name: build + sign the repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -eu
          sh .github/scripts/build-apt-repo.sh site/apt main
          cat > site/apt/index.html <<'EOF'
          <!doctype html>
          <title>wsl-webauthn-pam apt repository</title>
          <p>Debian/Ubuntu package repository for
          <a href="https://github.com/kirin-xiao/wsl-webauthn-pam">wsl-webauthn-pam</a>.
          See the project README for the setup commands.</p>
          EOF

      - name: upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/apt

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Validate the *published* assets, not the local build tree: this is the only
  # check that sees the real bytes. It stops at download → verify → extract →
  # `--help`; the installer is not run, since that would execute a root install
  # on the runner.
  smoke:
    name: post-release smoke (published assets)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download published bootstrap.sh + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p bootstrap.sh -p SHA256SUMS -D dist

      # The top-level bootstrap.sh must be the one in the tag, and must parse.
      - name: bootstrap.sh matches the tag and parses
        run: |
          set -eu
          cmp bootstrap.sh dist/bootstrap.sh
          sh -n dist/bootstrap.sh
          sh dist/bootstrap.sh --help | grep -q 'wsl-webauthn-pam bootstrap'

      - name: download + checksum-verify the x86_64 tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          arch=x86_64
          ver="${GITHUB_REF_NAME#v}"
          tarball="wsl-webauthn-pam-${ver}-${arch}.tar.gz"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p "$tarball" -D dist
          # Same lookup+compare bootstrap.sh uses, so drift fails here.
          expected="$(awk -v f="$tarball" '$2 == f { print $1 }' dist/SHA256SUMS)"
          [ -n "$expected" ] || { echo "::error::$tarball not in SHA256SUMS"; exit 1; }
          actual="$(sha256sum "dist/$tarball" | awk '{ print $1 }')"
          [ "$expected" = "$actual" ] || { echo "::error::checksum mismatch"; exit 1; }
          tar -xzf "dist/$tarball" -C dist
          dir="dist/wsl-webauthn-pam-${ver}-${arch}"
          test -x "$dir/wsl-webauthn-pam" || { echo "::error::CLI missing/not executable"; exit 1; }
          test -f "$dir/pam_wsl_webauthn.so" || { echo "::error::module missing"; exit 1; }
          test -f "$dir/WSLWebAuthnBridge.exe" || { echo "::error::bridge missing"; exit 1; }
          "$dir/wsl-webauthn-pam" --help | grep -qi 'usage'
          echo "published release layout verified"

      - name: download + checksum-verify the x86_64 .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The .deb name carries the mapped version (a pre-release tag v0.2.0-rc1
          # produces wsl-webauthn-pam_0.2.0~rc1_amd64.deb), unlike tarballs, which
          # keep the dash.
          ver=$(printf '%s' "${GITHUB_REF_NAME#v}" | tr '-' '~')
          deb="wsl-webauthn-pam_${ver}_amd64.deb"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p "$deb" -D dist
          expected="$(awk -v f="$deb" '$2 == f { print $1 }' dist/SHA256SUMS)"
          [ -n "$expected" ] || { echo "::error::$deb not in SHA256SUMS"; exit 1; }
          actual="$(sha256sum "dist/$deb" | awk '{ print $1 }')"
          [ "$expected" = "$actual" ] || { echo "::error::deb checksum mismatch"; exit 1; }
          dpkg-deb -I "dist/$deb" | grep -q 'Package: wsl-webauthn-pam'
          dpkg-deb -c "dist/$deb" | grep -q 'pam_wsl_webauthn.so'
          echo "published .deb verified"
