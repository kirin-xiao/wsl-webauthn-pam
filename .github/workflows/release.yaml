name: Release

# Release workflow.
#
# Trigger: pushing a tag matching `v*` (e.g. v0.1.0). The whole workflow builds
# from the *tag* ref (actions/checkout defaults to the triggering ref), so the
# artifacts are exactly the tagged commit.
#
# `publish` is gated on a `gate` job that re-runs fmt/clippy/test on the tagged
# commit, so a tag cannot publish bytes whose test/lint jobs never ran.
# (Tag pushes do not trigger ci.yaml, hence the in-workflow re-run.)
#
# Every `uses:` is pinned to a full 40-char commit SHA (see ci.yaml header).
# Release binaries are built with `[profile.release] strip=true, lto="thin"`
# (root Cargo.toml), preserving `panic = "unwind"`.
#
# Runner choice for aarch64: we use the native GitHub-hosted ARM runners
# (`ubuntu-24.04-arm`, `windows-11-arm`) rather than cross-compiling. This
# avoids shipping a cross-linked libpam0g-dev/CRT. If those labels are ever
# unavailable on a plan, replace the
# matrix `runner` values with an x86_64 runner + `cross`/`cargo-zigbuild`.
#
# Release layout (per architecture):
#   wsl-webauthn-pam-<version>-<arch>.tar.gz
#     ├── pam_wsl_webauthn.so        (Linux PAM module, renamed from lib…)
#     ├── wsl-webauthn-pam           (CLI)
#     ├── WSLWebAuthnBridge.exe      (Windows bridge for the same arch)
#     ├── bootstrap.sh
#     ├── pam-config
#     └── README.md
#   SHA256SUMS                       (checksums for all tarballs)
#   bootstrap.sh                     (also published top-level, so the
#                                     `releases/latest/download/bootstrap.sh`
#                                     URL works without a tarball)
#
# Both the Linux module and the matching Windows bridge ship in the same
# tarball because the CLI's `install` copies the bridge onto the Windows side.

on:
  push:
    tags: ["v*"]

# The release job needs write access to create the GitHub Release; build jobs
# explicitly drop back to read-only below.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "2"

jobs:
  build-linux:
    name: linux ${{ matrix.arch }} (.so + CLI)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build module + CLI (locked)
        run: >
          cargo build --release --locked
          -p wsl-webauthn-pam
          -p wsl-webauthn-cli

      - name: checksums
        run: |
          sha256sum target/release/libpam_wsl_webauthn.so
          sha256sum target/release/wsl-webauthn-pam

      - name: upload linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/libpam_wsl_webauthn.so
            target/release/wsl-webauthn-pam
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: windows ${{ matrix.arch }} (msvc exe)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build bridge (locked)
        run: cargo build --release --locked -p wsl-webauthn-bridge

      - name: checksum
        shell: bash
        run: sha256sum target/release/WSLWebAuthnBridge.exe

      - name: upload windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: target/release/WSLWebAuthnBridge.exe
          if-no-files-found: error
          retention-days: 7

  gate:
    name: gate (fmt, clippy, test)
    # A tag push does not run
    # ci.yaml (it triggers on pushes to main and on PRs), so without this a tag
    # could publish
    # a commit whose fmt/clippy/test never ran or failed. Re-run the gate here on
    # the *tagged* commit (checkout defaults to the tag ref = GITHUB_SHA) and
    # make `publish` depend on it. Cost: one ubuntu-latest job per tag.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      # bootstrap.sh ships in the release; shellcheck and the hermetic bootstrap
      # tests gate the tagged commit.
      - name: shellcheck
        run: |
          set -eu
          shellcheck -s sh bootstrap.sh
          shellcheck -s sh scripts/test-bootstrap.sh

      - name: hermetic bootstrap tests
        run: sh scripts/test-bootstrap.sh

  publish:
    name: publish release
    needs: [gate, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: assemble per-arch tarballs + SHA256SUMS
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/out
          for arch in x86_64 aarch64; do
            dir="wsl-webauthn-pam-${VERSION}-${arch}"
            mkdir -p "dist/out/${dir}"
            cp dist/linux-${arch}/libpam_wsl_webauthn.so "dist/out/${dir}/pam_wsl_webauthn.so"
            cp dist/linux-${arch}/wsl-webauthn-pam          "dist/out/${dir}/"
            cp dist/windows-${arch}/WSLWebAuthnBridge.exe   "dist/out/${dir}/"
            cp bootstrap.sh pam-config README.md            "dist/out/${dir}/"
            # `actions/upload-artifact`/`download-artifact` do not preserve Unix
            # permissions, so the CLI arrives mode 0644. `bootstrap.sh` executes
            # the tarball's CLI directly (`"$DIR/wsl-webauthn-pam" install`), so
            # restore the exec bit here; the post-release smoke asserts it.
            chmod 0755 "dist/out/${dir}/wsl-webauthn-pam" "dist/out/${dir}/bootstrap.sh"
            tar -czf "dist/${dir}.tar.gz" -C dist/out "${dir}"
            # The tarball root must be exactly the one named directory, so
            # `tar xzf … && cd …` (README) works and the layout cannot silently
            # regress to "contents at the root".
            top="$(tar -tzf "dist/${dir}.tar.gz" | sed -n '1p')"
            if [ "${top}" != "${dir}/" ]; then
              echo "::error::${dir}.tar.gz root entry is '${top}', expected '${dir}/'"
              exit 1
            fi
          done
          cd dist
          sha256sum wsl-webauthn-pam-*.tar.gz > SHA256SUMS
          echo '--- SHA256SUMS ---'
          cat SHA256SUMS

      - name: guard tag vs Cargo.toml version
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          # strip pre-release suffix for the comparison (e.g. 0.1.0-rc1 -> 0.1.0)
          base="${tag_version%%-*}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${base}" != "${manifest}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${manifest}"
            exit 1
          fi

      # Attach a signed SLSA build-provenance attestation to
      # the published tarballs and SHA256SUMS, so a downloader can verify which
      # workflow + commit produced them (`gh attestation verify <file> -R …`).
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Matches the release layout above: `wsl-webauthn-pam-<version>-<arch>.tar.gz`.
          # A pre-release version may itself contain a dash, so the leading `*` spans
          # `<version>` and the trailing `*` spans `<arch>`; the glob therefore still
          # requires both components (fail-closed, not a loose prefix match).
          # `bootstrap.sh` is attested too: it runs as root, so a downloader who
          # inspects before running can also check its provenance.
          subject-path: |
            dist/wsl-webauthn-pam-*-*.tar.gz
            dist/SHA256SUMS
            bootstrap.sh

      - name: publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/wsl-webauthn-pam-*-*.tar.gz
            dist/SHA256SUMS
            bootstrap.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags carrying a pre-release suffix (vX.Y.Z-rc1) publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Validate the *published* assets, not the local build tree: this is the only
  # check that sees the real bytes. It stops at download → verify → extract →
  # `--help`; the installer is not run, since that would execute a root install
  # on the runner.
  smoke:
    name: post-release smoke (published assets)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download published bootstrap.sh + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p bootstrap.sh -p SHA256SUMS -D dist

      # The top-level bootstrap.sh must be the one in the tag, and must parse.
      - name: bootstrap.sh matches the tag and parses
        run: |
          set -eu
          cmp bootstrap.sh dist/bootstrap.sh
          sh -n dist/bootstrap.sh
          sh dist/bootstrap.sh --help | grep -q 'wsl-webauthn-pam bootstrap'

      - name: download + checksum-verify the x86_64 tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          arch=x86_64
          ver="${GITHUB_REF_NAME#v}"
          tarball="wsl-webauthn-pam-${ver}-${arch}.tar.gz"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p "$tarball" -D dist
          # Same lookup+compare bootstrap.sh uses, so drift fails here.
          expected="$(awk -v f="$tarball" '$2 == f { print $1 }' dist/SHA256SUMS)"
          [ -n "$expected" ] || { echo "::error::$tarball not in SHA256SUMS"; exit 1; }
          actual="$(sha256sum "dist/$tarball" | awk '{ print $1 }')"
          [ "$expected" = "$actual" ] || { echo "::error::checksum mismatch"; exit 1; }
          tar -xzf "dist/$tarball" -C dist
          dir="dist/wsl-webauthn-pam-${ver}-${arch}"
          test -x "$dir/wsl-webauthn-pam" || { echo "::error::CLI missing/not executable"; exit 1; }
          test -f "$dir/pam_wsl_webauthn.so" || { echo "::error::module missing"; exit 1; }
          test -f "$dir/WSLWebAuthnBridge.exe" || { echo "::error::bridge missing"; exit 1; }
          "$dir/wsl-webauthn-pam" --help | grep -qi 'usage'
          echo "published release layout verified"
