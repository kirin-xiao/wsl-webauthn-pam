name: CI

# Hardened CI (plan §11, acceptance 7 / SR-22).
# Every `uses:` is pinned to a full 40-char commit SHA with a `# vX.Y.Z`
# comment (or, for dtolnay/rust-toolchain which publishes branches and no
# semver tags, the branch commit). Never use a moving tag here.
#
# Job inventory:
#   lint        linux: rustfmt + clippy(--all-targets -D warnings)
#   msrv        linux: cargo check --all-targets on the declared 1.88.0 floor
#   build       linux: cargo build --workspace --locked (links the pam cdylib)
#   test        linux: cargo test --workspace --locked (dlopen/pam_start/vectors)
#   windows     windows-latest (msvc): bridge clippy + unit tests
#   windows-gnu ubuntu: cross-build WSLWebAuthnBridge.exe for x86_64-pc-windows-gnu
#   aarch64     ubuntu: `cargo check` for aarch64-unknown-linux-gnu (link-free)
#   cargo-deny  supply-chain: advisories / bans / licenses / sources
#   actionlint  lint the workflow YAML itself
#   pam-profile SR-21 / acceptance 5: real pam-auth-update expansion guard
#   fuzz-smoke  nightly cargo-fuzz smoke (pinned 0.13.2, locked, artifacts on failure)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run: exercises the (conditional) fuzz job for a longer campaign.
    - cron: "17 3 * * *"

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast if any toolchain tries to touch the network for index updates.
  CARGO_NET_RETRY: "2"

jobs:
  lint:
    name: linux (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libpam0g-dev is only needed for *linking* the cdylib, but clippy also
      # compiles the pam crate's test targets, so install it here too.
      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: linux (MSRV 1.88.0 check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.88.0"

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `rust-version = 1.88` is the declared floor; this job is the gate that
      # keeps it honest (let-chains in the CLI need 1.88). `--locked` pins the
      # dependency versions the MSRV was validated against; without it a newer
      # transitive release could silently raise the effective MSRV.
      - name: cargo check (MSRV, locked)
        run: cargo check --workspace --all-targets --locked

  build:
    name: linux (build --locked smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ensures the pam_wsl_webauthn.so cdylib actually links against libpam.
      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build (locked)
        run: cargo build --workspace --locked

      - name: checksums
        run: |
          set -eu
          sha256sum target/debug/libpam_wsl_webauthn.so 2>/dev/null || true
          sha256sum target/debug/wsl-webauthn-pam 2>/dev/null || true

  test:
    name: linux (test --locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: test
        run: cargo test --workspace --locked

  windows:
    name: windows (bridge, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: clippy (bridge)
        run: cargo clippy -p wsl-webauthn-bridge --all-targets --locked -- -D warnings

      - name: test (bridge)
        run: cargo test -p wsl-webauthn-bridge --locked

  windows-gnu:
    name: linux -> x86_64-pc-windows-gnu (bridge cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust + gnu target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: x86_64-pc-windows-gnu

      # mingw-w64 provides a GNU linker/CRT for the windows-gnu target. Modern
      # Rust also ships a self-contained rust-mingw/rust-lld fallback, so this
      # is belt-and-braces.
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cross-build bridge (locked)
        run: cargo build --release -p wsl-webauthn-bridge --locked --target x86_64-pc-windows-gnu

      - name: checksum
        run: sha256sum target/x86_64-pc-windows-gnu/release/WSLWebAuthnBridge.exe

  aarch64:
    name: linux aarch64 (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust + aarch64 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Link-free portability gate. Full aarch64 release binaries are built on
      # native ARM runners in release.yaml (no cross libpam0g-dev juggling here).
      - name: cargo check (aarch64)
        run: cargo check --workspace --locked --target aarch64-unknown-linux-gnu

  cargo-deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked
          log-level: warn

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # Pin the underlying rhysd/actionlint release too (default is "latest").
          version: 1.7.12
          shellcheck: true
          pyflakes: false
          fail-on-error: true

  pam-profile:
    name: PAM profile expansion guard (SR-21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Unit-test the checker against committed fixtures (positive + the
      #    negative cases: `end` survives, success=0, bad action, bad key).
      - name: checker self-test (fixtures)
        run: python3 .github/scripts/check-pam-profile.py --self-test

      # 2. Validate our shipped pam-configs profile source.
      - name: validate pam-config source
        run: python3 .github/scripts/check-pam-profile.py --profile pam-config

      # 3. The real gate: let pam-auth-update expand the profile exactly the
      #    way the installer will, then parse the generated common-auth.
      - name: install profile + run pam-auth-update
        run: |
          set -eu
          sudo install -m 0644 pam-config /usr/share/pam-configs/wsl-webauthn
          # `--package` is the non-interactive mode designed for package
          # postinsts; `--enable` explicitly turns our `Default: no` profile on.
          # DEBIAN_FRONTEND=noninteractive prevents debconf/whiptail from ever
          # opening a TTY. `--force` makes the result deterministic on a
          # disposable runner: without it, pam-auth-update may decide the live
          # /etc/pam.d/common-* were "locally modified" and refuse to merge.
          # The jump-expansion algorithm this validates is identical either way.
          sudo DEBIAN_FRONTEND=noninteractive pam-auth-update --package --force --enable wsl-webauthn
          echo '--- generated /etc/pam.d/common-auth ---'
          grep -n 'pam_wsl_webauthn' /etc/pam.d/common-auth

      - name: assert expansion (SR-21)
        run: python3 .github/scripts/check-pam-profile.py /etc/pam.d/common-auth

  fuzz-smoke:
    name: fuzz smoke (nightly)
    runs-on: ubuntu-latest
    # cargo-fuzz shells out to a child `cargo`; rust-toolchain.toml pins
    # `stable` and would override the nightly install for that child, yielding
    # `-Zsanitizer only accepted on nightly`. RUSTUP_TOOLCHAIN wins over
    # toolchain files for every process in the job (cargo-fuzz + its children).
    #
    # cargo-fuzz 0.13.2 has no `--locked` pass-through to its child `cargo`, so
    # reproducibility is enforced by the committed `fuzz/Cargo.lock` plus
    # CARGO_NET_OFFLINE=1 on the build/run steps (not on `cargo install`):
    # cargo must satisfy the build from the locked graph and the local registry
    # cache, and fails rather than silently re-resolving.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The `fuzz/` cargo-fuzz workspace is committed, so `present` is true on
      # this ref. The gate is kept so that a fork/backport without `fuzz/` does
      # not fail the job; the heavy steps activate automatically when it lands.
      - name: detect fuzz workspace
        id: detect
        run: |
          if [ -f fuzz/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no fuzz/Cargo.toml on this ref; skipping cargo-fuzz smoke"
          fi

      - name: Install nightly Rust
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch

      - name: Cache
        if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        if: steps.detect.outputs.present == 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: cargo fuzz build (all targets)
        if: steps.detect.outputs.present == 'true'
        working-directory: fuzz
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz build

      # Short per-target run on PRs; a longer campaign on the nightly schedule.
      - name: cargo fuzz run (short)
        if: steps.detect.outputs.present == 'true' && github.event_name != 'schedule'
        working-directory: fuzz
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -eu
          for target in $(cargo fuzz list); do
            echo ">> fuzzing ${target} for 10s"
            cargo fuzz run "$target" -- -max_total_time=10
          done

      - name: cargo fuzz run (nightly campaign)
        if: steps.detect.outputs.present == 'true' && github.event_name == 'schedule'
        working-directory: fuzz
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -eu
          for target in $(cargo fuzz list); do
            echo ">> fuzzing ${target} for 300s"
            cargo fuzz run "$target" -- -max_total_time=300
          done

      # Preserve crash artifacts (the minimized reproducer inputs) when a fuzz
      # run fails, so the failure is actionable instead of leaving no trace.
      - name: Upload fuzz artifacts (on failure)
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
