name: CI

# Hardened CI.
# Every `uses:` is pinned to a full 40-char commit SHA with a `# vX.Y.Z`
# comment (or, for dtolnay/rust-toolchain which publishes branches and no
# semver tags, the branch commit). Never use a moving tag here.
#
# Job inventory:
#   lint        linux: rustfmt + clippy(--all-targets -D warnings)
#   msrv        linux: cargo check --all-targets on the declared 1.88.0 floor
#   build       linux: cargo build --workspace --locked (links the pam cdylib)
#   test        linux: cargo test --workspace --locked (dlopen/pam_start/vectors);
#                      WSL_WEBAUTHN_REQUIRE_LIBPAM=1 makes the libpam/ABI tiers
#                      FAIL (not skip) if the .so or libpam is missing
#   pam-ffi     linux: C host (dlopen + real pam_start) with a provisioned store
#                      in a user+mount namespace
#   windows     windows-latest (msvc): bridge clippy + unit tests
#   windows-gnu ubuntu: cross-build WSLWebAuthnBridge.exe for x86_64-pc-windows-gnu
#   aarch64     ubuntu-24.04-arm: native release build (really links the cdylib)
#   cargo-deny  supply-chain: advisories / bans / licenses / sources
#   machete     lint for genuinely unused manifest dependencies
#   actionlint  lint the workflow YAML itself
#   bootstrap   shellcheck + hermetic bootstrap.sh tests
#   pam-profile real pam-auth-update expansion guard
#   doc-invariants  documented invariants map to tests
#   fuzz-smoke  nightly cargo-fuzz smoke (pinned 0.13.2, locked, artifacts on failure)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run: exercises the (conditional) fuzz job for a longer campaign.
    - cron: "17 3 * * *"

# Least privilege by default; no job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep index-update retries low (the default is 3): a flaky network should surface
  # quickly instead of masking a real dependency problem.
  CARGO_NET_RETRY: "2"

jobs:
  lint:
    name: linux (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libpam0g-dev is only needed for *linking* the cdylib, but clippy also
      # compiles the pam crate's test targets, so install it here too.
      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `.gitattributes` forces LF on checkout, so a Windows clone with
      # core.autocrlf=true cannot rewrite bootstrap.sh/pam-config to CRLF. This
      # catches a CRLF that is committed *into* a tracked text file anyway.
      # `git grep -I` skips binary files; the pattern is a literal CR.
      - name: no CRLF in tracked text files
        run: |
          set -eu
          if git grep -I -l $'\r' -- .; then
            echo "::error::CR (CRLF) found in the tracked text files listed above"
            exit 1
          fi
          echo "no CR in tracked text files"

  msrv:
    name: linux (MSRV 1.88.0 check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.88.0"

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `rust-version = 1.88` is the declared floor; this job is the gate that
      # keeps it honest (let-chains in the CLI need 1.88). `--locked` pins the
      # dependency versions the MSRV was validated against; without it a newer
      # transitive release could silently raise the effective MSRV.
      - name: cargo check (MSRV, locked)
        run: cargo check --workspace --all-targets --locked

  build:
    name: linux (build --locked smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ensures the pam_wsl_webauthn.so cdylib actually links against libpam.
      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build (locked)
        run: cargo build --workspace --locked

      - name: checksums
        run: |
          set -eu
          sha256sum target/debug/libpam_wsl_webauthn.so 2>/dev/null || true
          sha256sum target/debug/wsl-webauthn-pam 2>/dev/null || true

  test:
    name: linux (test --locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Same Ubuntu 24.04 (`ubuntu-latest`) AppArmor workaround as `pam-ffi`:
      # `cargo test --workspace` also builds and runs the `c_host` provisioned
      # tier, which needs `unshare -rm`. Without this the tier falls back to
      # passwordless `sudo -n unshare -m`; with `WSL_WEBAUTHN_REQUIRE_LIBPAM=1`
      # a host that blocks both would fail the job rather than skip. The
      # sysctl is an optimisation (its failure is tolerated) so the gate keeps
      # its "green means the FFI path ran" signal without becoming brittle.
      - name: Allow unprivileged user namespaces (ubuntu-24.04 workaround)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # This gate makes the libpam (`pam_start`) and ABI (`dlopen`) tiers
      # FAIL rather than silently skip when the built `.so` (or libpam itself) is
      # absent. Without it a locate-library regression would leave CI green while
      # never loading the module. On a dev box the variable is unset, so the same
      # tests keep skipping.
      - name: test
        env:
          WSL_WEBAUTHN_REQUIRE_LIBPAM: "1"
        run: cargo test --workspace --locked

      # Regression guard: a default WSL/systemd host has a soft RLIMIT_NOFILE of
      # 1024. The held-fd bridge spawn must not call `F_DUPFD(fd, 1024)`, which fails
      # with EINVAL at that limit and would make every authentication fail on a
      # correctly configured install. Run the runner suite under that limit so a
      # regression is caught in CI, not just by the in-test setrlimit.
      - name: test (runner, default nofile limit, locked)
        run: bash -c 'ulimit -n 1024; cargo test -p wsl-webauthn-runner --locked'

      # Smoke the built CLI binary through its real argument dispatch,
      # unprivileged and store-free: `verify` runs the production verifier
      # against a synthetic ceremony and asserts two negative controls (a
      # tampered signature and a disallowed AAGUID must both be rejected).
      - name: CLI self-test (verify)
        run: |
          set -eu
          cargo build -p wsl-webauthn-cli --locked
          out="$(target/debug/wsl-webauthn-pam verify)"
          echo "$out"
          printf '%s\n' "$out" | grep -q '^verify: PASS$'

  # A *non-Rust* host for the module. It compiles
  # `crates/wsl-webauthn-pam/tests/c_host/pam_host.c`, dlopen(3)s the built cdylib
  # and calls the entry points, then drives the real libpam
  # (`pam_start_confdir` + `pam_authenticate`) with SIGPIPE reset to SIG_DFL —
  # the host disposition that exercises the module's SIGPIPE handling. The
  # provisioned tier gives the module a tempdir
  # store and a dynamic fake bridge inside a mount namespace (private /etc), so
  # the success path, the conversation prompt, and concurrent calls with distinct
  # `debug` arguments are all exercised without touching the host /etc.
  pam-ffi:
    name: linux (c host, real pam_start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libpam0g-dev supplies the headers and `-lpam` the C host links against.
      # (The WSLInterop registration the module's runner pre-flight reads is
      # planted inside the test's mount namespace, not the runner's.)
      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Ubuntu 24.04 (`ubuntu-latest`) restricts unprivileged user namespaces via
      # AppArmor, which blocks `unshare -rm`. Lift it for this disposable runner;
      # the harness still falls back to passwordless `sudo unshare -m` if the
      # sysctl is absent or a no-op, so this is an optimisation, not a hard
      # requirement.
      - name: Allow unprivileged user namespaces (ubuntu-24.04 workaround)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # `--all-targets` builds the C-host test, the dynamic fake-bridge example,
      # and the cdylib it dlopens. The gate makes the run fail closed.
      - name: build targets (incl. the dynamic bridge example)
        run: cargo build -p wsl-webauthn-pam --locked --all-targets

      - name: real-libpam + C-host tier
        env:
          WSL_WEBAUTHN_REQUIRE_LIBPAM: "1"
        run: cargo test -p wsl-webauthn-pam --locked --test c_host -- --nocapture

  windows:
    name: windows (bridge, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: clippy (bridge)
        run: cargo clippy -p wsl-webauthn-bridge --all-targets --locked -- -D warnings

      - name: test (bridge)
        run: cargo test -p wsl-webauthn-bridge --locked

  windows-gnu:
    name: linux -> x86_64-pc-windows-gnu (bridge cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust + gnu target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: x86_64-pc-windows-gnu

      # mingw-w64 provides a GNU linker/CRT for the windows-gnu target. Modern
      # Rust also ships a self-contained rust-mingw/rust-lld fallback, so this
      # is not strictly required.
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cross-build bridge (locked)
        run: cargo build --release -p wsl-webauthn-bridge --locked --target x86_64-pc-windows-gnu

      - name: checksum
        run: sha256sum target/x86_64-pc-windows-gnu/release/WSLWebAuthnBridge.exe

  aarch64:
    name: linux aarch64 (native release build)
    # A native ARM build is required here: `cargo check --target
    # aarch64-unknown-linux-gnu` never *links* the cdylib, so a PAM symbol-version
    # or cdylib-ABI regression would pass every PR/push and only surface when a
    # tag was cut. Build on a native GitHub-hosted ARM runner — the same runner
    # the aarch64 leg of release.yaml uses. ARM runners are free for public
    # repositories, so this adds no billed minutes.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Real linking requires the aarch64 PAM development headers.
      - name: Install libpam0g-dev
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build module + CLI (aarch64, locked)
        run: >
          cargo build --release --locked
          -p wsl-webauthn-pam
          -p wsl-webauthn-cli

      # A check-only job never links the cdylib, so assert the .so exists and
      # really is aarch64.
      - name: assert aarch64 module linked
        run: |
          set -eu
          so="target/release/libpam_wsl_webauthn.so"
          test -f "$so" || { echo "::error::$so was not produced"; exit 1; }
          file "$so"
          file "$so" | grep -q 'aarch64' \
            || { echo "::error::$so is not an aarch64 object"; exit 1; }
          sha256sum "$so" target/release/wsl-webauthn-pam

  cargo-deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `arguments` fully replaces the action's default, so spell out
      # `--all-features` explicitly. The action's default is `--all-features`;
      # passing only `--locked` silently drops it, which makes deny.toml's
      # `[graph] all-features = false` assertion unreachable and stops
      # denying advisories/licenses on a feature-enabled graph.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
          log-level: warn

  # A manifest may declare a dependency no source/target
  # in the crate actually uses. cargo check/build never notices, so gate it explicitly.
  machete:
    name: unused dependencies (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      # Pin cargo-machete by version (like cargo-fuzz below) rather than using
      # its action, whose entrypoint downloads the moving "latest" release.
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: cargo-machete
        run: cargo machete

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # Pin the underlying rhysd/actionlint release too (default is "latest").
          version: 1.7.12
          shellcheck: true
          pyflakes: false
          fail-on-error: true

  # bootstrap.sh runs as root on end-user machines (`curl … | sudo bash`):
  # shellcheck lints it, and the hermetic harness (`scripts/test-bootstrap.sh`)
  # exercises it with a whole-PATH command shim against a synthetic release
  # tree — no network, no privileges.
  bootstrap:
    name: shellcheck + bootstrap.sh (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck is preinstalled on ubuntu-latest; print its version for the
      # log, then lint the shell scripts.
      - name: shellcheck
        run: |
          set -eu
          shellcheck --version
          # `-s sh` matches the shebang; bootstrap.sh is POSIX sh.
          shellcheck -s sh bootstrap.sh
          shellcheck -s sh scripts/test-bootstrap.sh
          shellcheck -s sh crates/wsl-webauthn-pam/tests/c_host/provision_and_drive.sh
          shellcheck -s bash spike/build_testrp.sh

      - name: hermetic bootstrap tests
        run: sh scripts/test-bootstrap.sh

  pam-profile:
    name: PAM profile expansion guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Unit-test the checker against committed fixtures (positive + the
      #    negative cases: `end` survives, success=0, bad action, bad key).
      - name: checker self-test (fixtures)
        run: python3 .github/scripts/check-pam-profile.py --self-test

      # 2. Validate our shipped pam-configs profile source.
      - name: validate pam-config source
        run: python3 .github/scripts/check-pam-profile.py --profile pam-config

      # 3. The real gate: let pam-auth-update expand the profile exactly the
      #    way the installer will, then parse the generated common-auth.
      - name: install profile + run pam-auth-update
        run: |
          set -eu
          sudo install -m 0644 pam-config /usr/share/pam-configs/wsl-webauthn
          # `--package` is the non-interactive mode designed for package
          # postinsts; `--enable` explicitly turns our `Default: no` profile on.
          # DEBIAN_FRONTEND=noninteractive prevents debconf/whiptail from ever
          # opening a TTY. `--force` makes the result deterministic on a
          # disposable runner: without it, pam-auth-update may decide the live
          # /etc/pam.d/common-* were "locally modified" and refuse to merge.
          # The jump-expansion algorithm this validates is identical either way.
          sudo DEBIAN_FRONTEND=noninteractive pam-auth-update --package --force --enable wsl-webauthn
          echo '--- generated /etc/pam.d/common-auth ---'
          grep -n 'pam_wsl_webauthn' /etc/pam.d/common-auth

      - name: assert expansion
        run: python3 .github/scripts/check-pam-profile.py /etc/pam.d/common-auth

  # The documented security invariants (`SECURITY.md`, the verifier trust table)
  # are a specification that nothing forced to match the code. This guard maps
  # each `<!-- INVARIANT: ... -->` claim to the test that pins it and fails when
  # a claim has no test, a mapped test no longer exists, or a mapped negative
  # test stopped asserting the documented direction.
  doc-invariants:
    name: documented invariants map to tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Unit-test the checker against synthetic inputs (marker extraction,
      #    body matching, direction enforcement, unknown markers).
      - name: checker self-test
        run: python3 .github/scripts/check-doc-invariants.py --self-test

      # 2. The real gate: every documented invariant resolves to an existing,
      #    direction-consistent test. Known-uncovered invariants are reported
      #    distinctly and do not fail the job.
      - name: check documented invariants
        run: python3 .github/scripts/check-doc-invariants.py

  fuzz-smoke:
    name: fuzz smoke (nightly)
    runs-on: ubuntu-latest
    # cargo-fuzz shells out to a child `cargo`; rust-toolchain.toml pins
    # `stable` and would override the nightly install for that child, yielding
    # `-Zsanitizer only accepted on nightly`. RUSTUP_TOOLCHAIN wins over
    # toolchain files for every process in the job (cargo-fuzz + its children).
    #
    # The fuzz toolchain is pinned to a *dated* nightly so the compiler
    # (and therefore the sanitizer behaviour) does not drift; the same
    # value is passed to dtolnay/rust-toolchain below. A local `cargo fuzz`
    # invocation without this env var silently uses the stable toolchain from
    # rust-toolchain.toml — export RUSTUP_TOOLCHAIN=<this nightly> when fuzzing
    # locally (documented in CONTRIBUTING.md).
    #
    # cargo-fuzz 0.13.2 has no `--locked` pass-through to its child `cargo`, so
    # reproducibility is enforced by the committed `fuzz/Cargo.lock` plus
    # CARGO_NET_OFFLINE=1 on the build/run steps. The dependency graph is
    # fetched *online* first (`cargo fetch --locked`, which itself validates the
    # lock) so the build/run steps are guaranteed to have a populated registry
    # cache; on a cold runner the offline build would otherwise be unable to
    # download the fuzz workspace's deps (libfuzzer-sys, rsa, p256, …) since
    # `cargo install cargo-fuzz` above only fetches cargo-fuzz's own.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate skips gracefully instead of erroring when `fuzz/` is absent
      # (e.g. a fork or revert that drops it).
      - name: detect fuzz workspace
        id: detect
        run: |
          if [ -f fuzz/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no fuzz/Cargo.toml on this ref; skipping cargo-fuzz smoke"
          fi

      - name: Install nightly Rust
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch
        with:
          # Same dated nightly as RUSTUP_TOOLCHAIN above.
          toolchain: nightly-2026-09-30

      - name: Cache
        if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        if: steps.detect.outputs.present == 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # Populate the registry cache from the committed lock *before* switching
      # to offline mode. `cargo install` above only fetched cargo-fuzz's own
      # deps; without this, the offline build/run on a cold runner (or any
      # cache miss) cannot download the fuzz workspace's graph and fails.
      - name: Fetch fuzz dependencies (online, locked)
        if: steps.detect.outputs.present == 'true'
        working-directory: fuzz
        run: cargo fetch --locked

      - name: cargo fuzz build (all targets)
        if: steps.detect.outputs.present == 'true'
        working-directory: fuzz
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fuzz build

      # Short per-target run on PRs; a longer campaign on the nightly schedule.
      - name: cargo fuzz run (short)
        if: steps.detect.outputs.present == 'true' && github.event_name != 'schedule'
        working-directory: fuzz
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -eu
          for target in $(cargo fuzz list); do
            echo ">> fuzzing ${target} for 10s"
            cargo fuzz run "$target" -- -max_total_time=10
          done

      - name: cargo fuzz run (nightly campaign)
        if: steps.detect.outputs.present == 'true' && github.event_name == 'schedule'
        working-directory: fuzz
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -eu
          for target in $(cargo fuzz list); do
            echo ">> fuzzing ${target} for 300s"
            cargo fuzz run "$target" -- -max_total_time=300
          done

      # Preserve crash artifacts (the minimized reproducer inputs) when a fuzz
      # run fails, so the failure is actionable instead of leaving no trace.
      - name: Upload fuzz artifacts (on failure)
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
