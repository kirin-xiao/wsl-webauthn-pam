# cargo-deny configuration.
# Run: cargo deny check
#
# NOTE: the CI `cargo-deny` job (see .github/workflows/ci.yaml) invokes the action
# with `--all-features`, which overrides the `[graph]` defaults below. A bare local
# `cargo deny check` uses these `false` values instead. The gate is not made
# looser by either value: keeping `all-features = false` here means a feature-enabled
# graph is only checked when CI (or a local run) explicitly asks for it, so dropping
# `--all-features` from CI is a visible edit there rather than a silent config change.
[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# Fail on unmaintained/vulnerable advisories. `cargo deny check advisories`
# is part of CI.
ignore = [
    # RUSTSEC-2023-0071 ("Marvin Attack"): non-constant-time RSA private-key
    # operations in the `rsa` crate. It reaches us transitively through the
    # verifier's RS256 / packed-attestation verification.
    #
    # The *production* path is public-key verification only
    # (no private-key operation, no key generation) and the PAM path is local
    # and never network-reachable, so the remote-timing sidechannel the advisory
    # describes is not applicable. RSA private keys do exist — but solely in the
    # verifier's *test harness* (`tests/common/mod.rs`), which synthesizes
    # attestation vectors locally; that code is never linked into a shipped
    # binary. There is no patched release (upstream `patched = []` as of
    # rsa 0.9.10 / 0.10.0-rc); switching away would change the whole RustCrypto
    # generation pinned in the root Cargo.toml. Revisit if upstream ever ships a
    # constant-time release. A regression guard
    # (`crates/wsl-webauthn-verifier/tests/no_private_key_in_src.rs`) fails if a
    # production `src/` ever gains an RSA private-key construct.
    { id = "RUSTSEC-2023-0071", reason = "production path is public-key-only RSA verification on a local, non-network PAM path; RSA private keys exist only in the local test harness for synthesized vectors; upstream patched = []" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# `cargo deny check licenses` must be warning-free: every entry here is a license
# actually present in the resolved graph (`cargo deny list`). Do NOT pre-authorize
# a license for a dependency that does not exist yet — that silently widens the
# license gate and makes a genuinely new/unexpected license indistinguishable from
# an old allowance. Add a license here only when a real crates.io dep needs it.
allow = [
    # Project license.
    "MIT",
    # Dominant dual-license of the Rust ecosystem + common crypto crates.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Unicode data used by identifier/proptest tooling.
    "Unicode-3.0",
    # `memchr` (via a dependency of serde_json/bstr) is dual MIT/Unlicense.
    "Unlicense",
]
# Crypto crates pull a few Apache-2.0/MIT dual-licensed helpers; nothing exotic.
# Use `exceptions` for a one-off license that only one crate carries rather than
# adding it to the global `allow` list.
exceptions = []

[bans]
multiple-versions = "warn"
# The resolved graph carries a few duplicate crate versions. They are
# documented skips rather than an upstream dedupe we cannot safely perform:
#   * `winnow` 0.7 + 1.0 are both pulled by `toml` 0.9, which is mid-transition
#     between its old and new parser and pins each internally. We cannot choose
#     one without forking/patching `toml`.
#   * `syn` 2 + 3 are build-time-only proc-macro deps (der_derive/curve25519 vs
#     serde_derive); they never link into a shipped binary.
#   * the dev-only `rand` 0.8+0.9 / `getrandom` 0.2+0.3 split is entirely inside
#     `proptest`'s dev-dependency tree — those version pins are not ours to set.
# `skip` allows all versions of these crates to coexist without a warning; a
# duplicate of any *other* crate still warns. `skip-tree` exempts proptest's
# dev-only subtree the same way.
#
# Wildcard version requirements (e.g. `serde = "*"`) are denied outright; only
# *path* dependencies are exempted via `allow-wildcard-paths`. The workspace
# crates depend on each other through `path = "../…"` deps and are all
# `publish = false`, so those internal edges stay allowed while a wildcard
# *registry* requirement fails the check.
#
# NOTE: `allow-wildcard-paths` is only consulted when `wildcards != "allow"`.
# Setting `wildcards = "allow"` would disable the registry wildcard ban too.
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = [{ name = "winnow" }, { name = "syn" }]
skip-tree = [{ name = "proptest" }]

[sources]
unknown-registry = "deny"
# Every dependency resolves from the crates.io registry (no git sources in
# either lockfile). `allow-git = ["https://github.com/"]` would match nothing
# while pre-authorizing *any* github.com repo, so it is removed: if a git
# dependency is ever introduced, it should be listed explicitly as a pinned
# revision then, not blanket-allowed. `unknown-git = "deny"` rejects anything
# unlisted.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
