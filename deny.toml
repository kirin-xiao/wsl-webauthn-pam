# cargo-deny configuration (plan §11).
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# Fail on unmaintained/vulnerable advisories. `cargo deny check advisories`
# is part of CI.
ignore = [
    # RUSTSEC-2023-0071 ("Marvin Attack"): non-constant-time RSA private-key
    # operations in the `rsa` crate. It reaches us transitively through the
    # verifier's RS256 / packed-attestation verification (plan §4, D4). That is a
    # *public-key verify only* path: no RSA private key ever exists in this
    # project and the PAM path is local, never network-reachable — so the timing
    # sidechannel the advisory describes is not applicable. There is no patched
    # release (upstream `patched = []` as of rsa 0.9.10 / 0.10.0-rc); switching
    # away would change the whole RustCrypto generation pinned in the root
    # Cargo.toml. Revisit if upstream ever ships a constant-time release.
    { id = "RUSTSEC-2023-0071", reason = "public-key-only RSA verification on a local, non-network PAM path; no private keys; no upstream patch exists" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    # Project license.
    "MIT",
    # Dominant dual-license of the Rust ecosystem + common crypto crates.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    # Unicode data used by identifier/proptest tooling.
    "Unicode-3.0",
    # Pre-vetted permissive / weak-copyleft licenses expected from the Wave A
    # dependency tree. Kept here so a legitimate transitive dep does not stall
    # CI; MPL-2.0 is file-level copyleft and only acceptable for unmodified
    # third-party crates (we vendor none of it ourselves).
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# Crypto crates pull a few Apache-2.0/MIT dual-licensed helpers; nothing exotic.
exceptions = []

[bans]
multiple-versions = "warn"
# The crates in this workspace depend on each other through `path = "../…"`
# deps, which cargo-deny reports as "wildcard" requirements. They are internal
# and pinned by the workspace itself, so allow them; true wildcard *registry*
# requirements are still denied.
wildcards = "allow"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/"]
